<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de JavaScript</title>
</head>
<body>
    <h1>Operações matemáticas</h1>
</body>

<script>
    //Solicite dois números ao usuário e retorne as 4 operações básicas (soma, subtração, multiplicação e divisão) 
    // Como resultado na pégina
    // °
    // °
    // °

    const num1 = Number(window.prompt('Digite um número: '));
    const num2 = Number(window.prompt('Digite outro número'));
    const soma = num1 + num2;
    const sub = num1 - num2;
    const mult = num1 * num2;
    const div = num1 / num2;

    document.write(`Soma: ${soma} <br>`);
    document.write(`Subtração: ${sub} <br>`);
    document.write(`Multiplicação: ${mult} <br>`);
    document.write(`Divisão: ${div} <br>`);
</script>

</html>
